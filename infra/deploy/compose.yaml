services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  api:
    image: ${APP_IMAGE:?Set an ARM64 image tag or digest}
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      FRONTEND_REDIRECT_URL: ${FRONTEND_REDIRECT_URL:?Set FRONTEND_REDIRECT_URL}
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?Set GOOGLE_REDIRECT_URI}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?Set MEDIA_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:?Set GOOGLE_DRIVE_REDIRECT_URI}
      FRONTEND_STORAGE_REDIRECT_URL: ${FRONTEND_STORAGE_REDIRECT_URL:?Set FRONTEND_STORAGE_REDIRECT_URL}
      STORAGE_TOKEN_ENCRYPTION_KEY: ${STORAGE_TOKEN_ENCRYPTION_KEY:?Set STORAGE_TOKEN_ENCRYPTION_KEY}
    mem_limit: 640m
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
